<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo de Plataforma 2D - Jogo</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
        font-family: sans-serif;
    }
    canvas {
        display: block;
        margin: 0 auto;
        background: #87ceeb;
    }
    #timer {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
    }
    #endMenu {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        color: white;
        text-align: center;
        padding-top: 100px;
        font-size: 24px;
    }
    .btn {
        display: inline-block;
        margin: 20px;
        padding: 10px 20px;
        background: #FFD700;
        border: none;
        font-size: 18px;
        cursor: pointer;
        border-radius: 5px;
    }
    .btn:hover {
        background: #FFC000;
    }
</style>
</head>
<body>
<div id="timer">Tempo: 0s</div>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div id="endMenu">
    <div id="endMessage"></div>
    <button class="btn" id="restartBtn">Recomeçar</button>
    <button class="btn" id="closeBtn">Fechar</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevel = 0;
let startTime = Date.now();
let elapsedTime = 0;
let recordTime = localStorage.getItem('bestTime') ? parseFloat(localStorage.getItem('bestTime')) : null;
let gamePaused = false; // controla se o jogo está pausado

// Jogador
class Player {
    constructor() {
        this.width = 32;
        this.height = 32;
        this.x = 50;
        this.y = canvas.height - this.height - 50;
        this.vx = 0;
        this.vy = 0;
        this.speed = 3.5;
        this.jumpForce = -8;
        this.onGround = false;
    }

    draw() {
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }

    update(platforms) {
        this.x += this.vx;
        this.vy += 0.25;
        let nextY = this.y + this.vy;
        this.onGround = false;

        for (let plat of platforms) {
            if (this.x + this.width > plat.x && this.x < plat.x + plat.width) {
                if (this.y + this.height <= plat.y && nextY + this.height >= plat.y) {
                    nextY = plat.y - this.height;
                    this.vy = 0;
                    this.onGround = true;
                }
            }
        }

        this.y = nextY;

        if(this.y + this.height > canvas.height) {
            this.y = canvas.height - this.height;
            this.vy = 0;
            this.onGround = true;
        }
        if(this.x < 0) this.x = 0;

        const lastPlat = platforms[platforms.length - 1];
        if (this.x + this.width > lastPlat.x &&
            this.x < lastPlat.x + lastPlat.width &&
            this.y + this.height === lastPlat.y) {
            nextLevel();
        }
    }
}

// Plataforma
class Platform {
    constructor(x, y, width, height, isExit=false) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.isExit = isExit;
        this.blink = 0;
    }

    draw() {
        if(this.isExit) {
            this.blink += 0.1;
            let alpha = Math.abs(Math.sin(this.blink));
            ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        } else {
            ctx.fillStyle = '#654321';
        }
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

// Níveis
const levels = [
    [ new Platform(0, 380, 800, 20),
      new Platform(150, 300, 100, 10),
      new Platform(300, 250, 100, 10),
      new Platform(500, 200, 100, 10, true) ],
    [ new Platform(0, 380, 800, 20),
      new Platform(100, 300, 80, 10),
      new Platform(250, 250, 80, 10),
      new Platform(400, 200, 80, 10),
      new Platform(600, 150, 100, 10, true) ],
    [ new Platform(0, 380, 800, 20),
      new Platform(120, 320, 80, 10),
      new Platform(250, 270, 100, 10),
      new Platform(400, 220, 80, 10),
      new Platform(550, 170, 100, 10),
      new Platform(700, 120, 80, 10, true) ]
];

const player = new Player();
let currentPlatforms = levels[currentLevel];

// Teclado
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Plano de fundo
function drawBackground() {
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#228B22';
    ctx.fillRect(0, 380, canvas.width, 20);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(700, 80, 40, 0, Math.PI * 2);
    ctx.fill();
}

// Próximo nível
function nextLevel() {
    currentLevel++;
    if(currentLevel >= levels.length) {
        elapsedTime = (Date.now() - startTime) / 1000;
        let msg = `🎉 Parabéns! Você completou todas as fases em ${elapsedTime.toFixed(2)}s.\n`;
        if(!recordTime || elapsedTime < recordTime) {
            localStorage.setItem('bestTime', elapsedTime);
            msg += "🥇 Você bateu seu recorde!";
        } else {
            msg += `Seu recorde é ${recordTime.toFixed(2)}s.`;
        }
        showEndMenu(msg);
    } else {
        currentPlatforms = levels[currentLevel];
        player.x = 50;
        player.y = canvas.height - player.height - 50;
    }
}

// Atualizar tempo
function updateTimer() {
    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('timer').textContent = `Tempo: ${elapsedTime.toFixed(2)}s`;
}

// Mostrar menu final
function showEndMenu(message) {
    gamePaused = true;
    document.getElementById('endMessage').innerText = message;
    document.getElementById('endMenu').style.display = 'block';
}

// Botões do menu final
document.getElementById('restartBtn').addEventListener('click', () => {
    currentLevel = 0;
    startTime = Date.now();
    currentPlatforms = levels[currentLevel];
    player.x = 50;
    player.y = canvas.height - player.height - 50;
    document.getElementById('endMenu').style.display = 'none';
    gamePaused = false;
});

document.getElementById('closeBtn').addEventListener('click', () => {
    window.close();
});

// Loop do jogo
function gameLoop() {
    if(!gamePaused) {
        drawBackground();
        player.vx = 0;
        if(keys['ArrowLeft'] || keys['a']) player.vx = -player.speed;
        if(keys['ArrowRight'] || keys['d']) player.vx = player.speed;
        if((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) player.vy = player.jumpForce;

        player.update(currentPlatforms);
        player.draw();
        currentPlatforms.forEach(p => p.draw());
        updateTimer();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
